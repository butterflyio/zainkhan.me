name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the static site
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude '.git' --exclude '.github' --exclude 'incoming' \
            --exclude 'content.md' --exclude 'build_content.py' --exclude 'cv-body.html' --exclude 'make_cv_pdf.py' \
            --exclude 'optimize_photos.py' --exclude 'publish_herenow.sh' \
            --exclude '.gitignore' --exclude '*.log' \
            ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
